<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차곡 운행 보고서</title>
<meta name="description" content="차곡 앱(차량용 앱 개발 공모전 출품작)이 만든 운행 보고서를 읽기 전용으로 보여 주는 정적 페이지입니다. 입력 양식이나 로그인이 없습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* In the style of Hyundai's owner app: light grey canvas, white rounded cards, one deep navy card on top,
     navy buttons. No Hyundai logo or names (contest entry). Chromatic colour otherwise only for map data. */
  :root { --bg:#f4f5f7; --paper:#fff; --ink:#1a1a1a; --body:#333; --sub:#6b7280; --navy:#002c5f; --navy-sub:#b7c6dc;
          --tint:#e8eef6; --line:#e5e7eb; --inset:#f7f8fa;
          --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--body); font-family:var(--sans); font-size:16px; line-height:1.55; word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 56px; }
  a { color: var(--navy); font-weight: 600; text-underline-offset: 3px; }
  .hero { background: var(--navy); color:#fff; border-radius: 16px; padding: 22px 20px 20px; }
  .hero .brand { color: var(--navy-sub); font-size: 13px; font-weight: 600; }
  .hero h1 { color:#fff; font-weight: 700; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; letter-spacing: -0.02em; margin: 6px 0 4px; }
  .hero .period { color: var(--navy-sub); }
  .period { color: var(--sub); font-size: 14px; font-weight: 500; }
  main > .period { margin: 14px 4px; }
  section { background: var(--paper); border-radius: 16px; padding: 20px 18px; margin-top: 12px; }
  h2 { color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin: 0 0 10px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:15px; }
  .row:first-of-type { border-top:none; }
  .row span:first-child { color: var(--sub); }
  .row span:last-child { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 760px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:last-child, td:last-child { text-align: left; }
  th { color: var(--sub); font-weight: 600; background: var(--inset); }
  .notes { color: var(--sub); font-size: 13px; }
  .notes li { margin: 4px 0; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  button { font-family: var(--sans); }
  .actions button { flex:1; border:0; border-radius:10px; padding: 14px 20px; font-size: 15px; font-weight: 700; background: var(--navy); color: #fff; cursor:pointer; }
  .about { color: var(--sub); font-size: 13px; margin: 28px 4px 0; }
  #map, #mapfb { width:100%; height:420px; background:#eef0f3; overflow:hidden; position:relative; border-radius:12px; }
  #mapfb svg { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .mapwrap { position:relative; }
  .osm-tiles { filter: grayscale(0.85) contrast(0.95) brightness(1.03); }
  .seltip { width:0 !important; height:0 !important; border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--navy); background:none; filter: drop-shadow(0 0 1px #fff); }
  .leaflet-container { font-family: var(--sans); background:#eef0f3; }
  .leaflet-control-zoom a { color: var(--navy); }
  .leaflet-control-attribution a { color: var(--navy); }
  .viewbtn { position:absolute; top:10px; right:10px; z-index:1000; border:0; border-radius:8px; background:var(--navy); color:#fff; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .legend { display:flex; flex-wrap:wrap; gap:10px 14px; font-size:13px; color:var(--sub); margin:0 0 10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .dot { position:relative; width:22px; height:22px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); cursor:pointer; }

  .dot.ring { width:22px; height:22px; background:transparent !important; border:5px solid #0891b2; box-shadow:0 0 0 2px #fff, inset 0 0 0 2px #fff; }
  .dot.ring.stop { width:36px; height:36px; } /* 1-minute stop: bigger, an event at the same spot shows inside */
  .dot.min { width:10px; height:10px; border:0; background:#fff; box-shadow:0 0 0 2px #3b4352; }
  .layers { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .layers button { border:1px solid var(--line); border-radius:9999px; background:var(--paper); color:var(--ink); padding:7px 13px; font-size:14px; font-weight:600; cursor:pointer; }
  .layers button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .layers button i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:#c9ced6; }
  #info { margin-top:12px; }
  #info .hint { color:var(--sub); font-size:14px; }
  section > .hint { color:var(--sub); font-size:14px; margin:0 0 8px; }
  .rvmsg { color:var(--sub); font-size:13px; margin-top:8px; }
  @media print { .actions, .layers, .viewbtn { display:none; } body, section { background:#fff; } .hero { background:#fff; color:#000; border:1px solid #ccc; } .hero h1, .hero .brand, .hero .period { color:#000; } }
</style>
</head>
<body>
<main id="app">
  <header class="hero"><div class="brand">차곡</div>
  <h1>차곡 운행 보고서 보기</h1></header>
  <p class="period">차량용 앱 '차곡'이 만든 운행 보고서(주간 요약, 정비용, 차 이력, 운행기록부, 경로)를 읽기 전용으로 보여 주는 페이지입니다.
    보고서 내용은 링크 주소에 들어 있고, 이 페이지는 그것을 화면에 표시하기만 합니다. 로그인, 입력 양식, 결제, 파일 내려받기가 없습니다.</p>
  <p class="about"><a href="./">소개</a> · <a href="https://github.com/Dkgkgk622/Chagok">소스 코드</a></p>
</main>
<script>
(async function () {
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // What this site is, on every screen (also for reviewers of the site).
  // Wording kept plain on purpose: Safe Browsing flagged this page once (Nov 2026), so no brand names,
  // no "scan again / update your browser" instructions and no copy-to-system actions on the page.
  const ABOUT = '<p class="about">차곡은 차량용 앱 개발 공모전 출품작입니다. ' +
    '이 페이지는 읽기 전용이며, 보고서 데이터는 주소의 # 뒤에만 있어 이 사이트 서버로 전송되지 않습니다. ' +
    '경로 지도의 바탕은 화면에 보이는 지역만 OpenStreetMap에서 받아옵니다. ' +
    '<a href="./">소개</a> · <a href="https://github.com/Dkgkgk622/Chagok">소스 코드</a></p>';

  function fail(msg) {
    app.innerHTML = '<header class="hero"><div class="brand">차곡</div><h1>보고서를 표시하지 못했습니다</h1></header><p class="period">' + esc(msg) + '</p>' + ABOUT;
  }

  const hash = location.hash.slice(1);
  if (!hash) return; // keep the static description above
  if (!('DecompressionStream' in window)) return fail('이 브라우저에는 보고서를 푸는 기능(DecompressionStream)이 없습니다.');

  let report;
  try {
    // The data lives only in the URL fragment, which the browser never sends to a server.
    const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    report = JSON.parse(await new Response(stream).text());
  } catch (e) {
    return fail('링크의 보고서 데이터가 손상되었습니다.');
  }

  const created = new Date(report.created).toLocaleString('ko-KR');
  let html = '<header class="hero"><div class="brand">차곡 · 차량이 자동으로 기록한 데이터</div>' +
    '<h1>' + esc(report.title) + '</h1>' +
    '<div class="period">' + esc(report.period) + ' · 생성 ' + esc(created) + '</div></header>';

  let route = null;
  const hideNote = report.route && report.route.h
    ? '<p class="hint">집·회사 위치 보호를 위해 출발·도착 지점 반경 ' + Number(report.route.h) + 'm 안은 표시하지 않습니다.</p>' : '';
  if (report.route && !report.route.b && report.route.h) {
    html += '<section><h2>경로</h2>' + hideNote + '<p class="hint">짧은 운행이라 이 범위를 빼면 표시할 경로가 없습니다. 전체 경로는 차 화면에서 볼 수 있어요.</p></section>';
  }
  if (report.route && report.route.b) {
    route = decodeRoute(report.route);
    html += '<section><h2>경로</h2>' + hideNote + '<div class="legend">' +
      '<span><i style="background:#fff;box-shadow:0 0 0 2px #3b4352"></i>' + (route.iv >= 120 ? Math.round(route.iv / 60) + '분' : '1분') + '마다 위치</span>' +
      '<span><i style="background:#7c3aed"></i>과속</span></div>' +
      '<div class="layers">' + Object.entries(LAYERS).map(([k, l]) =>
        '<button data-layer="' + k + '"><i></i>' + l.label + '</button>').join('') + '</div>' +
      '<div class="mapwrap"><div id="map"></div><button class="viewbtn" id="viewbtn" style="display:none"></button></div>' +
      '<p class="rvmsg" id="viewhint"></p><div id="info"><p class="hint">흰 점(1분마다)이나 표시를 누르면 그때의 시각·속도·제한속도가 나와요.</p></div>' +
      '</section>';
  }

  // Sections (for a route report they come under the map).
  for (const sec of report.sections || []) {
    html += '<section><h2>' + esc(sec.t) + '</h2>';
    for (const [k, v] of sec.r || []) html += '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
    html += '</section>';
  }

  if (report.tx) report.tax = decodeTax(report.tx);
  if (report.tax && report.tax.length) {
    html += '<section><h2>운행 내역 (국세청 별지 서식 ③~⑩)</h2><div class="table-wrap"><table><thead><tr>' +
      ['사용일자', '사용자', '주행 전(km)', '주행 후(km)', '주행거리(km)', '출·퇴근(km)', '일반업무(km)', '비고'].map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>' +
      report.tax.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div></section>';
  }

  html += '<section><ul class="notes">' + (report.notes || []).map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' +
    '<div class="notes">보고서 번호 ' + esc(report.check) + ' (차 화면의 번호와 같으면 같은 보고서)</div></section>' +
    '<div class="actions"><button onclick="window.print()">인쇄 / PDF 저장</button>' +
    (navigator.share ? '<button onclick="navigator.share({title: document.title, url: location.href})">공유</button>' : '') + '</div>' + ABOUT;

  app.innerHTML = html;
  document.title = '차곡 · ' + report.title;
  if (route) showRoute(route);
})();

// ---------------- route ----------------

// Optional layers, off until the reader turns them on. Overspeed is always shown.
const LAYERS = {
  accel: { label: '급가속', color: '#ea580c', on: false, ring: true },
  brake: { label: '급감속', color: '#be123c', on: false, ring: true },
  dwell: { label: '1분 이상 정차', color: '#0891b2', on: false, ring: true },
};
function layerOf(m) {
  if (m.kind === 'dwell') return 'dwell';
  if (m.kind === 'event') return m.code === 'Q' || m.code === 'A' ? 'accel' : m.code === 'B' || m.code === 'S' ? 'brake' : null;
  return null;
}
function visible(m) { const l = layerOf(m); return !l || LAYERS[l].on; }
let onLayersChanged = () => {};
function setupLayerButtons() {
  document.querySelectorAll('.layers button').forEach(b => {
    const l = LAYERS[b.dataset.layer];
    const paint = () => {
      b.classList.toggle('on', l.on);
      const i = b.querySelector('i'), c = l.on ? l.color : '#d6d0c4';
      if (l.ring) { i.style.background = 'transparent'; i.style.boxShadow = 'inset 0 0 0 3px ' + c; } else i.style.background = c;
    };
    paint();
    b.addEventListener('click', () => { l.on = !l.on; paint(); onLayersChanged(); });
  });
}

const EVENT = {
  Q: ['급출발', '#ea580c', '최고 가속'], A: ['급가속', '#ea580c', '최고 가속'],
  B: ['급감속', '#be123c', '최고 감속'], S: ['급정지', '#be123c', '최고 감속'],
  O: ['과속', '#7c3aed', null], I: ['장시간 정차', '#2563eb', null],
};

// Compact logbook rows from the app (Report.compactTax) back to the printed cells ③~⑩.
function decodeTax(tx) {
  const f = t => t == null ? '' : (t < 0 ? '-' : '') + Math.floor(Math.abs(t) / 10) + '.' + (Math.abs(t) % 10);
  const two = n => (n < 10 ? '0' : '') + n;
  let day = 0, prevEnd = null;
  return (tx.r || []).map(([d, u, s, e, k, p, n]) => {
    day += d;
    const start = s === -1 ? prevEnd : s;
    const end = e === -1 ? start + k : e;
    const dt = new Date(day * 86400000); // a calendar date: read it in UTC so the phone's time zone cannot shift it
    const date = dt.getUTCFullYear() + '.' + two(dt.getUTCMonth() + 1) + '.' + two(dt.getUTCDate()) + '(' + '일월화수목금토'[dt.getUTCDay()] + ')';
    const dist = f(k);
    prevEnd = end;
    return [date, u === 0 ? tx.u : u, f(start), f(end), dist, p === 1 ? dist : '', p === 2 ? dist : '', n];
  });
}

function decodeRoute(r) {
  const la0 = r.b[0], lo0 = r.b[1];
  let t = r.t0, la = la0, lo = lo0;
  const points = (r.p || []).map(p => {
    t += p[0] * 1000; la += p[1]; lo += p[2];
    return { kind: 'point', t, lat: la / 1e5, lon: lo / 1e5, speed: p[3] < 0 ? null : p[3], limit: p[4] < 0 ? null : p[4] };
  });
  const events = (r.e || []).map(e => ({
    kind: 'event', code: e[1], t: r.t0 + e[0] * 1000, lat: (la0 + e[2]) / 1e5, lon: (lo0 + e[3]) / 1e5,
    speed: e[4] < 0 ? null : e[4], limit: e[5] < 0 ? null : e[5], peak: e[6] < 0 ? null : e[6] / 10, len: e[7] < 0 ? null : e[7],
  }));
  const dwells = (r.d || []).map(d => ({
    kind: 'dwell', t: r.t0 + d[0] * 1000, len: d[1], lat: (la0 + d[2]) / 1e5, lon: (lo0 + d[3]) / 1e5, speed: 0, limit: null,
  }));
  // The road line goes through every recorded place in time order, not only the 1-minute points,
  // so event and stop marks sit on it (they are real positions between two minute points).
  const line = [...points, ...events, ...dwells].sort((a, b) => a.t - b.t);
  return { iv: r.iv || 60, points, events, dwells, line, all: [...points, ...dwells, ...events] };
}

/**
 * Which mark a tap means. Close to a mark: that mark. On the road line (between marks): the nearest
 * visible mark — a recorded value, never one estimated between two records.
 * xy: mark -> {x, y} in the same units as tap; tolerances in those units.
 */
/**
 * Only what is drawn can be picked: the minute dots on screen (after thinning), events and stops.
 * The road between dots has no recorded value, so tapping it picks nothing (decided Nov 2026: zoomed in,
 * "some spots work, some don't" was worse than "only the dots work").
 * Events and stops win over a minute dot at almost the same distance.
 */
const TAP_PX = 28;
function pickMark(tap, candidates, xy) {
  let best = null, bestD = Infinity;
  candidates.forEach(m => {
    const p = xy(m), d = Math.hypot(p.x - tap.x, p.y - tap.y);
    const score = d - (m.kind === 'event' ? 8 : m.kind === 'dwell' ? 6 : 0);
    if (d <= TAP_PX && score < bestD) { bestD = score; best = m; }
  });
  return best;
}

/** Tap = press and release within 10 px and 600 ms (map libraries drop clicks after a 3 px finger wobble). */
function onTap(el, skip, fn) {
  let start = null;
  el.addEventListener('pointerdown', e => { start = e.isPrimary && !skip(e.target) ? { x: e.clientX, y: e.clientY, t: Date.now() } : null; }, true);
  el.addEventListener('pointerup', e => {
    if (!start || !e.isPrimary) return;
    const ok = Math.hypot(e.clientX - start.x, e.clientY - start.y) <= 10 && Date.now() - start.t <= 600;
    start = null;
    if (ok) { const r = el.getBoundingClientRect(); fn(e.clientX - r.left, e.clientY - r.top); }
  }, true);
  el.addEventListener('pointercancel', () => { start = null; }, true);
}

// Accel, brake and 1-minute stops are hollow rings; overspeed and route points are filled.
function isRing(m) { return m.kind === 'dwell' || (m.kind === 'event' && m.code !== 'O'); }
function colorOf(m) { return m.kind === 'event' ? EVENT[m.code][1] : m.kind === 'dwell' ? '#0891b2' : '#ffffff'; }
function pad2(n) { return String(n).padStart(2, '0'); }
function when(t) { const d = new Date(t); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }

function showInfo(m) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const title = m.kind === 'event' ? EVENT[m.code][0] : m.kind === 'dwell' ? '1분 이상 정차' : '경로 지점';
  const rows = [
    [m.code === 'O' ? '과속 시작' : '시각', when(m.t)],
    [m.code === 'O' ? '최고 속도 (이 지점)' : '속도', m.speed != null ? m.speed + ' km/h' : '-'],
    ['제한속도', m.limit != null ? m.limit + ' km/h' : '정보 없음'],
  ];
  if (m.kind === 'event' && m.peak != null && EVENT[m.code][2]) rows.push([EVENT[m.code][2], m.peak.toFixed(1) + ' km/h/s']);
  if (m.kind === 'event' && m.len != null) rows.push([m.code === 'O' ? '과속 지속' : '이어진 시간', m.len < 1 ? '1초 미만' : m.len + '초']);
  if (m.kind === 'dwell') rows.push(['정차 시간', Math.floor(m.len / 60) + '분 ' + (m.len % 60) + '초']);
  document.getElementById('info').innerHTML = '<h2>' + esc(title) + '</h2>' +
    rows.map(([k, v]) => '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>').join('') +
    '';
}

function showRoute(route) {
  setupLayerButtons();
  loadLeaflet(route);
}

// ---------------- free base map (no key) ----------------
// OpenStreetMap tiles drawn grey (CSS filter on the tile layer) under the route. OSM tile policy:
// visible attribution, normal viewport loading only, no prefetch/offline. If Leaflet cannot load
// (offline, blocked CDN) the plain drawing (drawFallback) is used instead.
const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
function loadLeaflet(route) {
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = LEAFLET + 'leaflet.css';
  document.head.appendChild(css);
  const js = document.createElement('script');
  js.src = LEAFLET + 'leaflet.js';
  js.onload = () => {
    try { drawLeaflet(route); } catch (e) {
      console.error(e);
      // Start the plain drawing on a clean element, not on top of a half-built map.
      const note = document.getElementById('basenote'); if (note) note.remove();
      const old = document.getElementById('map'), fresh = document.createElement('div');
      fresh.id = 'map'; old.replaceWith(fresh);
      drawFallback(route, '지도를 불러오지 못해 간단한 그림으로 보여요.');
    }
  };
  js.onerror = () => drawFallback(route, '지도를 불러오지 못해 간단한 그림으로 보여요. (인터넷 연결 확인)');
  document.head.appendChild(js);
}

function drawLeaflet(route) {
  const el = document.getElementById('map');
  document.getElementById('viewhint').insertAdjacentHTML('beforebegin',
    '<p class="rvmsg" id="basenote">바탕 지도는 OpenStreetMap입니다. 경로의 점 사이는 직선이라 실제 도로와 조금 다를 수 있어요.</p>');
  const g = measure(route);
  const P = 24;
  const size = () => ({ W: el.clientWidth || 360, H: el.clientHeight || 420 });
  const LL = (x, y) => [g.lat0 + y / M_PER_DEG, g.lon0 + x / (M_PER_DEG * g.k)];
  const XY = ll => ({ x: (ll.lng - g.lon0) * M_PER_DEG * g.k, y: (ll.lat - g.lat0) * M_PER_DEG });
  // Web Mercator, 256 px tiles: metres per pixel at zoom z here, and the zoom for a given metres per pixel.
  const mppAt = z => 156543.034 * g.k / Math.pow(2, z);
  const zoomFor = mpp => Math.log2(156543.034 * g.k / mpp);
  // Plain wheel scrolls the page; Ctrl+wheel (and trackpad pinch) zooms, handled below.
  const map = L.map(el, { zoomSnap: 0.25, zoomDelta: 0.5, scrollWheelZoom: false, attributionControl: true });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, className: 'osm-tiles',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  // A hard stop far out (a fling cannot run away); the real rule is keepRoute on every move, below.
  const ext = Math.max(g.maxX - g.minX, g.maxY - g.minY, 2 * MIN_SPAN_M);
  map.setMaxBounds([LL(g.minX - ext, g.minY - ext), LL(g.maxX + ext, g.maxY + ext)]);
  map.options.maxBoundsViscosity = 1;

  const { W: W0, H: H0 } = size();
  const canClose = firstView(route, g, W0, H0, P, false).partial;
  function show(whole) {
    const { W, H } = size();
    const v = firstView(route, g, W, H, P, whole);
    // Partial view: nearest 0.25 zoom step (6.0-7.1 dots across). Whole route: round down so all of it fits.
    const z = zoomFor(v.mpp), zz = Math.min(18, v.partial ? Math.round(z * 4) / 4 : Math.floor(z * 4) / 4);
    map.setView(LL(v.cx, v.cy), zz, { animate: false });
    map.setMinZoom(Math.min(zz, Math.floor(zoomFor(firstView(route, g, W, H, P, true).mpp) * 4) / 4) - 1);
    if (canClose) setViewUi(v.partial, () => show(v.partial));
  }
  show(false);
  // Never lose the road (same rule as the plain drawing and the car screen).
  map.on('moveend', () => {
    const { W, H } = size(), c = XY(map.getCenter()), mpp = mppAt(map.getZoom());
    const k = keepRoute(route, { cx: c.x, cy: c.y, mpp }, W, H);
    if (Math.hypot(k.cx - c.x, k.cy - c.y) / mpp > 1) map.panTo(LL(k.cx, k.cy));
  });

  // Road: white casing under a dark line so it reads on the grey map.
  const line = route.line.map(m => [m.lat, m.lon]);
  if (line.length > 1) {
    L.polyline(line, { color: '#fff', weight: 11, opacity: 0.95, interactive: false }).addTo(map);
    L.polyline(line, { color: '#3b4352', weight: 6, opacity: 0.95, interactive: false }).addTo(map);
  }
  const marks = L.layerGroup().addTo(map);
  const items = [...route.points, ...route.dwells, ...route.events];
  let selected = null;
  const tip = L.divIcon({ className: 'seltip', iconSize: [22, 20], iconAnchor: [11, 20] });
  let selMarker = null;
  let drawn = []; // what can be tapped: exactly what render() drew
  function render() {
    marks.clearLayers();
    drawn = [];
    let lastDot = null; // zoomed out, minute dots closer than 20 px would merge into a dotted line: skip those
    items.forEach(m => {
      if (!visible(m)) return;
      const p = map.latLngToContainerPoint([m.lat, m.lon]);
      if (m.kind === 'point') {
        if (lastDot && Math.hypot(p.x - lastDot.x, p.y - lastDot.y) < 20 && m !== route.points[route.points.length - 1]) return;
        lastDot = p;
        drawn.push(m);
        L.circleMarker([m.lat, m.lon], { radius: 4, color: '#3b4352', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(marks);
      } else if (isRing(m)) {
        drawn.push(m);
        const r = m.kind === 'dwell' ? 15 : 9;
        L.circleMarker([m.lat, m.lon], { radius: r, color: '#fff', weight: 7, fill: false, interactive: false }).addTo(marks);
        L.circleMarker([m.lat, m.lon], { radius: r, color: colorOf(m), weight: 4, fill: false, interactive: false }).addTo(marks);
      } else {
        drawn.push(m);
        L.circleMarker([m.lat, m.lon], { radius: 8, color: '#fff', weight: 3, fillColor: colorOf(m), fillOpacity: 1, interactive: false }).addTo(marks);
      }
    });
    if (selMarker) selMarker.remove();
    if (selected) selMarker = L.marker([selected.lat, selected.lon], { icon: tip, interactive: false, keyboard: false }).addTo(map);
  }
  map.on('zoomend', render);
  onLayersChanged = render;
  render();

  onTap(el, t => !!t.closest('.leaflet-control, .viewbtn'), (x, y) => {
    const best = pickMark({ x, y }, drawn, m => map.latLngToContainerPoint([m.lat, m.lon]));
    if (best) { selected = best; showInfo(best); render(); }
  });
  // Ctrl+wheel / trackpad pinch: many small events, so add them up and zoom in 0.25 steps.
  let wheelAcc = 0;
  el.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    wheelAcc -= e.deltaY * 0.01;
    const step = Math.trunc(wheelAcc * 4) / 4;
    if (!step) return;
    wheelAcc -= step;
    map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + step, { animate: false });
  }, { passive: false });
}

// ---------------- first view ----------------
// A long route is not squeezed onto one screen: the first view shows about DOTS_ACROSS one-minute dots
// across the map (on a straight road), starting near the beginning. "전체 보기" switches to the whole route.
const M_PER_DEG = 111320;
const DOTS_ACROSS = 6.5;   // ~6-7 minute dots across the screen
const MIN_SPAN_M = 300;    // never closer than ~300 m across (one spot, traffic jam)

/** Flat metres around the route's middle (x east, y north) on every mark, plus extent and typical metres per minute. */
function measure(route) {
  const lats = route.all.map(m => m.lat), lons = route.all.map(m => m.lon);
  const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2, lon0 = (Math.min(...lons) + Math.max(...lons)) / 2;
  const k = Math.cos(lat0 * Math.PI / 180);
  route.all.forEach(m => { m.x = (m.lon - lon0) * M_PER_DEG * k; m.y = (m.lat - lat0) * M_PER_DEG; });
  const xs = route.all.map(m => m.x), ys = route.all.map(m => m.y);
  // Moving minutes only (>= 3 km/h): stops would make the typical step look tiny.
  const perMin = [];
  for (let i = 1; i < route.points.length; i++) {
    const a = route.points[i - 1], b = route.points[i], min = (b.t - a.t) / 60000;
    if (min > 0) { const v = Math.hypot(b.x - a.x, b.y - a.y) / min; if (v >= 50) perMin.push(v); }
  }
  perMin.sort((a, b) => a - b);
  return { lat0, lon0, k, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys),
           perMin: perMin.length ? perMin[perMin.length >> 1] : null };
}

/** {cx, cy (metres), mpp (metres per px), partial} for a W x H px map with padding P. */
function firstView(route, g, W, H, P, whole) {
  const floor = MIN_SPAN_M / Math.max(1, Math.min(W, H) - 2 * P);
  const fitMpp = Math.max((g.maxX - g.minX) / (W - 2 * P), (g.maxY - g.minY) / (H - 2 * P), floor);
  const fit = { cx: (g.minX + g.maxX) / 2, cy: (g.minY + g.maxY) / 2, mpp: fitMpp, partial: false };
  if (whole || !g.perMin) return fit;
  // 6.5 dots across the whole visible width. A long route thinned for the QR has a dot every iv seconds
  // (2, 4 ... minutes), so scale by the dot spacing, not by the minute: the reader counts dots.
  const perDot = g.perMin * Math.max(1, (route.iv || 60) / 60);
  const capMpp = Math.max(DOTS_ACROSS * perDot / W, floor);
  if (fitMpp <= capMpp) return fit; // short enough: the whole route already has well-spaced dots
  // Put the start just inside the screen edge, on the side the road leaves from, so the road runs
  // across the whole screen: direction = start → where the road is half a screen later.
  const s0 = route.line[0], half = W / 2 * capMpp;
  const a = route.line.find(m => Math.hypot(m.x - s0.x, m.y - s0.y) >= half) || route.line[route.line.length - 1];
  const len = Math.hypot(a.x - s0.x, a.y - s0.y);
  if (!len) return { cx: s0.x, cy: s0.y, mpp: capMpp, partial: true, fitMpp };
  const ux = (a.x - s0.x) / len, uy = (a.y - s0.y) / len;
  const toEdge = Math.min(ux ? W / 2 / Math.abs(ux) : Infinity, uy ? H / 2 / Math.abs(uy) : Infinity); // px, centre → edge
  const reach = Math.max(0, toEdge - 1.5 * P) * capMpp; // start ~1.5 padding inside the edge (room for zoom rounding)
  return { cx: s0.x + ux * reach, cy: s0.y + uy * reach, mpp: capMpp, partial: true, fitMpp };
}

/**
 * Never lose the road: if no part of the route line is within KEEP px of the map edges, slide the view
 * just enough that the nearest part of the line is back inside. Same rule as RouteModel.View.keepRoute (car screen).
 */
const KEEP = 60;
function keepRoute(route, v, W, H) {
  const pts = route.line;
  if (!pts.length) return v;
  let best = null, bestD = Infinity;
  const near = (ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const u = L ? Math.max(0, Math.min(1, ((v.cx - ax) * dx + (v.cy - ay) * dy) / L)) : 0;
    return { x: ax + u * dx, y: ay + u * dy };
  };
  for (let i = 0; i < pts.length; i++) {
    const p = i ? near(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y) : { x: pts[0].x, y: pts[0].y };
    const d = Math.hypot(p.x - v.cx, p.y - v.cy);
    if (d < bestD) { bestD = d; best = p; }
  }
  const hx = Math.max(0, W / 2 - KEEP) * v.mpp, hy = Math.max(0, H / 2 - KEEP) * v.mpp;
  return { ...v, cx: Math.min(Math.max(v.cx, best.x - hx), best.x + hx), cy: Math.min(Math.max(v.cy, best.y - hy), best.y + hy) };
}

function setViewUi(partial, onToggle) {
  const btn = document.getElementById('viewbtn'), hint = document.getElementById('viewhint');
  if (!btn) return;
  btn.style.display = '';
  btn.textContent = partial ? '전체 보기' : '처음 부분 보기';
  btn.onclick = onToggle;
  hint.textContent = partial ? '경로가 길어 처음 부분부터 보여요. 끌어서 옮기고, 두 손가락(PC는 Ctrl+휠)으로 확대·축소할 수 있어요.' : '';
}

/**
 * Map library not available (offline, blocked CDN): the same marks on a plain drawing, tappable.
 * Drawn in screen pixels (so dots keep their size) and redrawn on every move: drag to pan,
 * pinch or wheel to zoom.
 */
function drawFallback(route, message) {
  const el = document.getElementById('map');
  el.id = 'mapfb';
  document.getElementById('viewhint').insertAdjacentHTML('beforebegin',
    '<p class="rvmsg">' + message + ' 점 사이는 직선이라 실제 도로와 다를 수 있어요.</p>');
  const g = measure(route);
  const P = 24;
  const items = [...route.points, ...route.dwells, ...route.events];
  let W = el.clientWidth || 360, H = el.clientHeight || 420;
  let v = firstView(route, g, W, H, P, false);
  const canClose = v.partial;
  const maxMpp = firstView(route, g, W, H, P, true).mpp * 2, minMpp = 0.3;
  let selected = null;
  let drawn = []; // what can be tapped: exactly what render() drew
  const X = m => W / 2 + (m.x - v.cx) / v.mpp, Y = m => H / 2 - (m.y - v.cy) / v.mpp;

  function render() {
    v = keepRoute(route, v, W, H);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    if (route.line.length > 1) svg += '<polyline fill="none" stroke="#3b4352" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" points="' +
      route.line.map(p => X(p).toFixed(1) + ',' + Y(p).toFixed(1)).join(' ') + '"/>';
    let lastDot = null; // zoomed far out, minute dots closer than 20 px would merge into a dotted line: skip those
    drawn = [];
    items.forEach(m => {
      if (!visible(m)) return;
      const x = X(m), y = Y(m);
      if (m.kind === 'point') {
        if (lastDot && Math.hypot(x - lastDot.x, y - lastDot.y) < 20 && m !== route.points[route.points.length - 1]) return;
        lastDot = { x, y };
      }
      if (x < -40 || x > W + 40 || y < -40 || y > H + 40) return;
      drawn.push(m);
      const r = m.kind === 'point' ? 4 : m.kind === 'dwell' ? 15 : 9;
      if (isRing(m)) {
        svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="none" stroke="#fff" stroke-width="7"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="none" stroke="' + colorOf(m) + '" stroke-width="4"/>';
      } else {
        const stroke = m.kind === 'point' ? 'none' : '#fff';
        svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + colorOf(m) + '" stroke="' + stroke + '" stroke-width="3"/>';
      }
    });
    if (selected) { // downward triangle above the chosen place, tip on the centre of the road
      const x = X(selected), y = Y(selected);
      svg += '<polygon points="' + x + ',' + y + ' ' + (x - 11) + ',' + (y - 21) + ' ' + (x + 11) + ',' + (y - 21) + '" fill="#002c5f" stroke="#fff" stroke-width="2"/>';
    }
    el.innerHTML = svg + '</svg>';
  }
  function show(whole) {
    v = firstView(route, g, W, H, P, whole);
    if (canClose) setViewUi(v.partial, () => show(v.partial));
    render();
  }
  function zoomAt(px, py, f) {
    const mpp = Math.min(maxMpp, Math.max(minMpp, v.mpp * f));
    // keep the ground under (px, py) where it is
    const gx = v.cx + (px - W / 2) * v.mpp, gy = v.cy - (py - H / 2) * v.mpp;
    v = { ...v, mpp, cx: gx - (px - W / 2) * mpp, cy: gy + (py - H / 2) * mpp };
  }
  function tap(px, py) {
    // Only drawn dots, events and stops (pickMark).
    const best = pickMark({ x: px, y: py }, drawn, m => ({ x: X(m), y: Y(m) }));
    if (best) { selected = best; showInfo(best); render(); }
  }

  const ptrs = new Map();
  let moved = 0, last = null, down = null; // moved: farthest the finger got from where it went down (px)
  const local = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const pair = () => { const [a, b] = [...ptrs.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size === 1) { moved = 0; down = local(e); }
    last = ptrs.size === 2 ? pair() : local(e);
  });
  el.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size === 1) {
      const p = local(e), dx = p.x - last.x, dy = p.y - last.y;
      moved = Math.max(moved, Math.hypot(p.x - down.x, p.y - down.y));
      v = { ...v, cx: v.cx - dx * v.mpp, cy: v.cy + dy * v.mpp };
      last = p;
    } else if (ptrs.size === 2) {
      const q = pair();
      v = { ...v, cx: v.cx - (q.x - last.x) * v.mpp, cy: v.cy + (q.y - last.y) * v.mpp };
      if (q.d > 0 && last.d > 0) zoomAt(q.x, q.y, last.d / q.d);
      moved += 100; // a pinch is never a tap
      last = q;
    }
    render();
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && moved <= 10) tap(p.x, p.y); // same 10 px tap rule as onTap (base map)
    if (ptrs.size === 1) last = [...ptrs.values()][0];
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); });
  // Plain wheel scrolls the page as usual; Ctrl+wheel (and trackpad pinch, which arrives as Ctrl+wheel) zooms the map.
  el.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault(); const p = local(e); zoomAt(p.x, p.y, Math.exp(e.deltaY * 0.004)); render();
  }, { passive: false });
  window.addEventListener('resize', () => { W = el.clientWidth || W; H = el.clientHeight || H; render(); });

  onLayersChanged = render;
  show(false);
}
</script>
</body>
</html>
