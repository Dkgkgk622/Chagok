<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차곡 운행 보고서</title>
<meta name="description" content="차곡 앱(차량용 앱 개발 공모전 출품작)이 만든 운행 보고서를 읽기 전용으로 보여 주는 정적 페이지입니다. 입력 양식이나 로그인이 없습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Reading-room look: warm paper canvas, warm grays, serif headings, pill buttons, square cards.
     Chromatic colour only where it carries data (map events, layers). */
  :root { --canvas:#f7f4ed; --paper:#fff; --ink:#242424; --body:#333; --btn:#191919; --sub:#6b6b6b; --line:#e9e4d9;
          --serif:"Noto Serif KR", "Noto Serif CJK KR", "AppleMyungjo", "Batang", Georgia, serif;
          --sans:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--body); font-family:var(--sans); font-size:16px; line-height:1.55;  word-break:keep-all; overflow-wrap:anywhere;}
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  .brand { color: var(--ink); font-size: 15px; letter-spacing: .01em; }
  h1 { font-family: var(--serif); font-weight: 400; color: var(--ink); font-size: clamp(32px, 7vw, 48px); line-height: 1.12; letter-spacing: -0.02em; margin: 18px 0 10px; }
  .period { color: var(--sub); font-size: 15px; }
  section { background: var(--paper); padding: 20px 16px; margin-top: 16px; }
  h2 { font-family: var(--serif); font-weight: 600; color: var(--ink); font-size: 19px; margin: 0 0 10px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
  .row:first-of-type { border-top:none; }
  .row span:first-child { color: var(--sub); }
  .row span:last-child { color: var(--ink); font-weight: 600; text-align: right; }
  .table-wrap { overflow-x: auto; }
  table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 760px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:last-child, td:last-child { text-align: left; }
  th { color: var(--sub); font-weight: 400; }
  .notes { color: var(--sub); font-size: 13px; }
  .notes li { margin: 4px 0; }
  .actions { display:flex; gap:8px; margin-top:20px; }
  button { font-family: var(--sans); }
  .actions button { border:0; border-radius:9999px; padding: 10px 20px; font-size: 15px; background: var(--btn); color: #fff; cursor:pointer; }
  .about { color: var(--sub); font-size: 13px; margin-top: 40px; }
  #map, #mapfb { width:100%; height:420px; background:#ece7dc; overflow:hidden; position:relative; }
  #mapfb svg { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .mapwrap { position:relative; }
  .viewbtn { position:absolute; top:10px; right:10px; z-index:5; border:0; border-radius:9999px; background:var(--btn); color:#fff; padding:7px 14px; font-size:13px; cursor:pointer; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 14px; font-size:13px; color:var(--sub); margin:0 0 10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .dot { position:relative; width:22px; height:22px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); cursor:pointer; }

  .dot.ring { width:22px; height:22px; background:transparent !important; border:5px solid #0891b2; box-shadow:0 0 0 2px #fff, inset 0 0 0 2px #fff; }
  .dot.ring.stop { width:36px; height:36px; } /* 1-minute stop: bigger, an event at the same spot shows inside */
  .dot.min { width:10px; height:10px; border:0; background:#fff; box-shadow:0 0 0 2px #4a4640; }
  .layers { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .layers button { border:1px solid var(--line); border-radius:9999px; background:var(--paper); color:var(--ink); padding:7px 14px; font-size:14px; cursor:pointer; }
  .layers button.on { background:var(--btn); border-color:var(--btn); color:#fff; }
  .layers button i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:#d6d0c4; }
  #info { margin-top:12px; }
  #info .hint { color:var(--sub); font-size:14px; }
  section > .hint { color:var(--sub); font-size:14px; margin:0 0 8px; }
  #rv { width:100%; height:240px; margin-top:10px; display:none; }
  .rvmsg { color:var(--sub); font-size:13px; margin-top:8px; }
  @media print { .actions, .layers { display:none; } body, section { background:#fff; } section { border:1px solid #ddd; } }
</style>
</head>
<body>
<main id="app">
  <div class="brand">차곡</div>
  <h1>차곡 운행 보고서 보기</h1>
  <p class="period">차량용 앱 '차곡'이 만든 운행 보고서(주간 요약, 정비용, 차 이력, 운행기록부, 경로)를 읽기 전용으로 보여 주는 페이지입니다.
    보고서 내용은 링크 주소에 들어 있고, 이 페이지는 그것을 화면에 표시하기만 합니다. 로그인, 입력 양식, 결제, 파일 내려받기가 없습니다.</p>
  <p class="about"><a href="./">소개</a> · <a href="https://github.com/Dkgkgk622/Chagok">소스 코드</a></p>
</main>
<script>
// Kakao Maps JavaScript key (Kakao Developers > 내 애플리케이션 > 앱 키 > JavaScript 키).
// The page's address (https://dkgkgk622.github.io) must be registered under 플랫폼 > Web.
// Without a key the route is drawn as a simple picture (no map tiles, address or road view).
const KAKAO_JS_KEY = 'YOUR_KAKAO_JS_KEY';

(async function () {
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // What this site is, on every screen (also for reviewers of the site).
  // Wording kept plain on purpose: Safe Browsing flagged this page once (Nov 2026), so no brand names,
  // no "scan again / update your browser" instructions and no copy-to-system actions on the page.
  const ABOUT = '<p class="about">차곡은 차량용 앱 개발 공모전 출품작입니다. ' +
    '이 페이지는 읽기 전용이며, 보고서 데이터는 주소의 # 뒤에만 있어 서버로 전송되지 않습니다. ' +
    '<a href="./">소개</a> · <a href="https://github.com/Dkgkgk622/Chagok">소스 코드</a></p>';

  function fail(msg) {
    app.innerHTML = '<div class="brand">차곡</div><h1>보고서를 표시하지 못했습니다</h1><p class="period">' + esc(msg) + '</p>' + ABOUT;
  }

  const hash = location.hash.slice(1);
  if (!hash) return; // keep the static description above
  if (!('DecompressionStream' in window)) return fail('이 브라우저에는 보고서를 푸는 기능(DecompressionStream)이 없습니다.');

  let report;
  try {
    // The data lives only in the URL fragment, which the browser never sends to a server.
    const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    report = JSON.parse(await new Response(stream).text());
  } catch (e) {
    return fail('링크의 보고서 데이터가 손상되었습니다.');
  }

  const created = new Date(report.created).toLocaleString('ko-KR');
  let html = '<div class="brand">차곡 · 차량이 자동으로 기록한 데이터</div>' +
    '<h1>' + esc(report.title) + '</h1>' +
    '<div class="period">' + esc(report.period) + ' · 생성 ' + esc(created) + '</div>';

  let route = null;
  const hideNote = report.route && report.route.h
    ? '<p class="hint">집·회사 위치 보호를 위해 출발·도착 지점 반경 ' + Number(report.route.h) + 'm 안은 표시하지 않습니다.</p>' : '';
  if (report.route && !report.route.b && report.route.h) {
    html += '<section><h2>경로</h2>' + hideNote + '<p class="hint">짧은 운행이라 이 범위를 빼면 표시할 경로가 없습니다. 전체 경로는 차 화면에서 볼 수 있어요.</p></section>';
  }
  if (report.route && report.route.b) {
    route = decodeRoute(report.route);
    html += '<section><h2>경로</h2>' + hideNote + '<div class="legend">' +
      '<span><i style="background:#fff;box-shadow:0 0 0 2px #4a4640"></i>' + (route.iv >= 120 ? Math.round(route.iv / 60) + '분' : '1분') + '마다 위치</span>' +
      '<span><i style="background:#7c3aed"></i>과속</span></div>' +
      '<div class="layers">' + Object.entries(LAYERS).map(([k, l]) =>
        '<button data-layer="' + k + '"><i></i>' + l.label + '</button>').join('') + '</div>' +
      '<div class="mapwrap"><div id="map"></div><button class="viewbtn" id="viewbtn" style="display:none"></button></div>' +
      '<p class="rvmsg" id="viewhint"></p><div id="info"><p class="hint">경로의 점이나 표시를 누르면 그때의 시각·주소·속도·제한속도와 주변 사진이 나와요.</p></div>' +
      '<div id="rv"></div></section>';
  }

  // Sections (for a route report they come under the map).
  for (const sec of report.sections || []) {
    html += '<section><h2>' + esc(sec.t) + '</h2>';
    for (const [k, v] of sec.r || []) html += '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
    html += '</section>';
  }

  if (report.tx) report.tax = decodeTax(report.tx);
  if (report.tax && report.tax.length) {
    html += '<section><h2>운행 내역 (국세청 별지 서식 ③~⑩)</h2><div class="table-wrap"><table><thead><tr>' +
      ['사용일자', '사용자', '주행 전(km)', '주행 후(km)', '주행거리(km)', '출·퇴근(km)', '일반업무(km)', '비고'].map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>' +
      report.tax.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div></section>';
  }

  html += '<section><ul class="notes">' + (report.notes || []).map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' +
    '<div class="notes">보고서 번호 ' + esc(report.check) + ' (차 화면의 번호와 같으면 같은 보고서)</div></section>' +
    '<div class="actions"><button onclick="window.print()">인쇄 / PDF 저장</button>' +
    (navigator.share ? '<button onclick="navigator.share({title: document.title, url: location.href})">공유</button>' : '') + '</div>' + ABOUT;

  app.innerHTML = html;
  document.title = '차곡 · ' + report.title;
  if (route) showRoute(route);
})();

// ---------------- route ----------------

// Optional layers, off until the reader turns them on. Overspeed is always shown.
const LAYERS = {
  accel: { label: '급가속', color: '#ea580c', on: false, ring: true },
  brake: { label: '급감속', color: '#be123c', on: false, ring: true },
  dwell: { label: '1분 이상 정차', color: '#0891b2', on: false, ring: true },
};
function layerOf(m) {
  if (m.kind === 'dwell') return 'dwell';
  if (m.kind === 'event') return m.code === 'Q' || m.code === 'A' ? 'accel' : m.code === 'B' || m.code === 'S' ? 'brake' : null;
  return null;
}
function visible(m) { const l = layerOf(m); return !l || LAYERS[l].on; }
let onLayersChanged = () => {};
function setupLayerButtons() {
  document.querySelectorAll('.layers button').forEach(b => {
    const l = LAYERS[b.dataset.layer];
    const paint = () => {
      b.classList.toggle('on', l.on);
      const i = b.querySelector('i'), c = l.on ? l.color : '#d6d0c4';
      if (l.ring) { i.style.background = 'transparent'; i.style.boxShadow = 'inset 0 0 0 3px ' + c; } else i.style.background = c;
    };
    paint();
    b.addEventListener('click', () => { l.on = !l.on; paint(); onLayersChanged(); });
  });
}

const EVENT = {
  Q: ['급출발', '#ea580c', '최고 가속'], A: ['급가속', '#ea580c', '최고 가속'],
  B: ['급감속', '#be123c', '최고 감속'], S: ['급정지', '#be123c', '최고 감속'],
  O: ['과속', '#7c3aed', null], I: ['장시간 정차', '#2563eb', null],
};

// Compact logbook rows from the app (Report.compactTax) back to the printed cells ③~⑩.
function decodeTax(tx) {
  const f = t => t == null ? '' : (t < 0 ? '-' : '') + Math.floor(Math.abs(t) / 10) + '.' + (Math.abs(t) % 10);
  const two = n => (n < 10 ? '0' : '') + n;
  let day = 0, prevEnd = null;
  return (tx.r || []).map(([d, u, s, e, k, p, n]) => {
    day += d;
    const start = s === -1 ? prevEnd : s;
    const end = e === -1 ? start + k : e;
    const dt = new Date(day * 86400000); // a calendar date: read it in UTC so the phone's time zone cannot shift it
    const date = dt.getUTCFullYear() + '.' + two(dt.getUTCMonth() + 1) + '.' + two(dt.getUTCDate()) + '(' + '일월화수목금토'[dt.getUTCDay()] + ')';
    const dist = f(k);
    prevEnd = end;
    return [date, u === 0 ? tx.u : u, f(start), f(end), dist, p === 1 ? dist : '', p === 2 ? dist : '', n];
  });
}

function decodeRoute(r) {
  const la0 = r.b[0], lo0 = r.b[1];
  let t = r.t0, la = la0, lo = lo0;
  const points = (r.p || []).map(p => {
    t += p[0] * 1000; la += p[1]; lo += p[2];
    return { kind: 'point', t, lat: la / 1e5, lon: lo / 1e5, speed: p[3] < 0 ? null : p[3], limit: p[4] < 0 ? null : p[4] };
  });
  const events = (r.e || []).map(e => ({
    kind: 'event', code: e[1], t: r.t0 + e[0] * 1000, lat: (la0 + e[2]) / 1e5, lon: (lo0 + e[3]) / 1e5,
    speed: e[4] < 0 ? null : e[4], limit: e[5] < 0 ? null : e[5], peak: e[6] < 0 ? null : e[6] / 10, len: e[7] < 0 ? null : e[7],
  }));
  const dwells = (r.d || []).map(d => ({
    kind: 'dwell', t: r.t0 + d[0] * 1000, len: d[1], lat: (la0 + d[2]) / 1e5, lon: (lo0 + d[3]) / 1e5, speed: 0, limit: null,
  }));
  // The road line goes through every recorded place in time order, not only the 1-minute points,
  // so event and stop marks sit on it (they are real positions between two minute points).
  const line = [...points, ...events, ...dwells].sort((a, b) => a.t - b.t);
  return { iv: r.iv || 60, points, events, dwells, line, all: [...points, ...dwells, ...events] };
}

/**
 * Which mark a tap means. Close to a mark: that mark. On the road line (between marks): the nearest
 * visible mark — a recorded value, never one estimated between two records.
 * xy: mark -> {x, y} in the same units as tap; tolerances in those units.
 */
function pickMark(tap, route, xy, markTol, lineTol) {
  const vis = route.all.filter(visible);
  let best = null, bestD = Infinity;
  vis.forEach(m => { const p = xy(m); const d = Math.hypot(p.x - tap.x, p.y - tap.y); if (d < bestD) { bestD = d; best = m; } });
  if (best && bestD <= markTol) return best;
  const pts = route.line.map(xy);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
    const u = len2 ? Math.max(0, Math.min(1, ((tap.x - a.x) * dx + (tap.y - a.y) * dy) / len2)) : 0;
    if (Math.hypot(a.x + u * dx - tap.x, a.y + u * dy - tap.y) <= lineTol) return best;
  }
  return null;
}

// Accel, brake and 1-minute stops are hollow rings; overspeed and route points are filled.
function isRing(m) { return m.kind === 'dwell' || (m.kind === 'event' && m.code !== 'O'); }
function colorOf(m) { return m.kind === 'event' ? EVENT[m.code][1] : m.kind === 'dwell' ? '#0891b2' : '#ffffff'; }
function pad2(n) { return String(n).padStart(2, '0'); }
function when(t) { const d = new Date(t); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }

function showInfo(m, address) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const title = m.kind === 'event' ? EVENT[m.code][0] : m.kind === 'dwell' ? '1분 이상 정차' : '경로 지점';
  const rows = [
    [m.code === 'O' ? '과속 시작' : '시각', when(m.t)],
    ...(address ? [['주소', address]] : []),
    [m.code === 'O' ? '최고 속도 (이 지점)' : '속도', m.speed != null ? m.speed + ' km/h' : '-'],
    ['제한속도', m.limit != null ? m.limit + ' km/h' : '정보 없음'],
  ];
  if (m.kind === 'event' && m.peak != null && EVENT[m.code][2]) rows.push([EVENT[m.code][2], m.peak.toFixed(1) + ' km/h/s']);
  if (m.kind === 'event' && m.len != null) rows.push([m.code === 'O' ? '과속 지속' : '이어진 시간', m.len < 1 ? '1초 미만' : m.len + '초']);
  if (m.kind === 'dwell') rows.push(['정차 시간', Math.floor(m.len / 60) + '분 ' + (m.len % 60) + '초']);
  document.getElementById('info').innerHTML = '<h2>' + esc(title) + '</h2>' +
    rows.map(([k, v]) => '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>').join('') +
    '<div class="rvmsg" id="rvmsg"></div>';
}

function showRoute(route) {
  setupLayerButtons();
  if (!KAKAO_JS_KEY || KAKAO_JS_KEY.startsWith('YOUR_')) return drawFallback(route, '지도 키가 설정되지 않아 간단한 그림으로 보여요.');
  const sdk = document.createElement('script');
  sdk.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) + '&autoload=false&libraries=services';
  sdk.onload = () => { try { kakao.maps.load(() => drawKakao(route)); } catch (e) { drawFallback(route, '지도를 불러오지 못해 간단한 그림으로 보여요.'); } };
  sdk.onerror = () => drawFallback(route, '지도를 불러오지 못해 간단한 그림으로 보여요. (인터넷 연결 또는 지도 키 확인)');
  document.head.appendChild(sdk);
}

// ---------------- first view ----------------
// A long route is not squeezed onto one screen: the first view shows about DOTS_ACROSS one-minute dots
// across the map (on a straight road), starting near the beginning. "전체 보기" switches to the whole route.
const M_PER_DEG = 111320;
const DOTS_ACROSS = 6.5;   // ~6-7 minute dots across the screen
const MIN_SPAN_M = 300;    // never closer than ~300 m across (one spot, traffic jam)

/** Flat metres around the route's middle (x east, y north) on every mark, plus extent and typical metres per minute. */
function measure(route) {
  const lats = route.all.map(m => m.lat), lons = route.all.map(m => m.lon);
  const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2, lon0 = (Math.min(...lons) + Math.max(...lons)) / 2;
  const k = Math.cos(lat0 * Math.PI / 180);
  route.all.forEach(m => { m.x = (m.lon - lon0) * M_PER_DEG * k; m.y = (m.lat - lat0) * M_PER_DEG; });
  const xs = route.all.map(m => m.x), ys = route.all.map(m => m.y);
  // Moving minutes only (>= 3 km/h): stops would make the typical step look tiny.
  const perMin = [];
  for (let i = 1; i < route.points.length; i++) {
    const a = route.points[i - 1], b = route.points[i], min = (b.t - a.t) / 60000;
    if (min > 0) { const v = Math.hypot(b.x - a.x, b.y - a.y) / min; if (v >= 50) perMin.push(v); }
  }
  perMin.sort((a, b) => a - b);
  return { lat0, lon0, k, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys),
           perMin: perMin.length ? perMin[perMin.length >> 1] : null };
}

/** {cx, cy (metres), mpp (metres per px), partial} for a W x H px map with padding P. */
function firstView(route, g, W, H, P, whole) {
  const floor = MIN_SPAN_M / Math.max(1, Math.min(W, H) - 2 * P);
  const fitMpp = Math.max((g.maxX - g.minX) / (W - 2 * P), (g.maxY - g.minY) / (H - 2 * P), floor);
  const fit = { cx: (g.minX + g.maxX) / 2, cy: (g.minY + g.maxY) / 2, mpp: fitMpp, partial: false };
  if (whole || !g.perMin) return fit;
  const capMpp = Math.max(DOTS_ACROSS * g.perMin / (W - 2 * P), floor);
  if (fitMpp <= capMpp) return fit; // short enough: the whole route already has well-spaced dots
  // Centre a few minutes after the start so the road leads into the screen from the beginning.
  const t = route.line[0].t + DOTS_ACROSS / 2 * 60000;
  const c = route.line.find(m => m.t >= t) || route.line[route.line.length - 1];
  return { cx: c.x, cy: c.y, mpp: capMpp, partial: true, fitMpp };
}

function setViewUi(partial, onToggle) {
  const btn = document.getElementById('viewbtn'), hint = document.getElementById('viewhint');
  if (!btn) return;
  btn.style.display = '';
  btn.textContent = partial ? '전체 보기' : '처음 부분 보기';
  btn.onclick = onToggle;
  hint.textContent = partial ? '경로가 길어 처음 부분부터 보여요. 끌어서 옮기고, 두 손가락으로 확대·축소할 수 있어요.' : '';
}

function drawKakao(route) {
  const K = kakao.maps;
  const el = document.getElementById('map');
  const map = new K.Map(el, { center: new K.LatLng(route.all[0].lat, route.all[0].lon), level: 5 });
  const g = measure(route);
  const toLL = (x, y) => new K.LatLng(g.lat0 + y / M_PER_DEG, g.lon0 + x / (M_PER_DEG * g.k));
  const W = el.clientWidth, H = el.clientHeight, P = 24;
  const canClose = firstView(route, g, W, H, P, false).partial;
  function show(whole) {
    const v = firstView(route, g, W, H, P, whole);
    const hw = v.mpp * (W - 2 * P) / 2, hh = v.mpp * (H - 2 * P) / 2;
    const b = new K.LatLngBounds(toLL(v.cx - hw, v.cy - hh), toLL(v.cx + hw, v.cy + hh));
    map.setBounds(b);
    if (map.getLevel() < 3) map.setLevel(3); // one spot only (very short trip): do not zoom in past street level
    if (v.partial) {
      // Kakao zoom comes in steps of 2x: if the step left the dots too close, go one step in, same centre.
      const proj = map.getProjection(), a = proj.containerPointFromCoords(toLL(v.cx, v.cy)),
        c = proj.containerPointFromCoords(toLL(v.cx + g.perMin, v.cy));
      if (Math.abs(c.x - a.x) < (W - 2 * P) / 9 && map.getLevel() > 3) { map.setLevel(map.getLevel() - 1); map.setCenter(toLL(v.cx, v.cy)); }
    }
    if (canClose) setViewUi(v.partial, () => show(v.partial));
  }
  show(false);
  if (route.line.length > 1) {
    new K.Polyline({ map, path: route.line.map(p => new K.LatLng(p.lat, p.lon)), strokeWeight: 11, strokeColor: '#4a4640', strokeOpacity: 0.9 });
  }
  const geocoder = new K.services.Geocoder();
  const rvClient = new K.RoadviewClient();
  const rvEl = document.getElementById('rv');
  let roadview = null;
  // Selected place: a downward triangle whose tip sits on the centre of the road.
  const tri = document.createElement('div');
  tri.style.cssText = 'width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;' +
    'border-top:20px solid #191919;filter:drop-shadow(0 0 1px #fff);pointer-events:none';
  const selMark = new K.CustomOverlay({ content: tri, xAnchor: 0.5, yAnchor: 1, zIndex: 10 });

  function select(m) {
    selMark.setPosition(new K.LatLng(m.lat, m.lon));
    selMark.setMap(map);
    showInfo(m);
    geocoder.coord2Address(m.lon, m.lat, (res, status) => {
      if (status === K.services.Status.OK && res[0]) {
        const a = res[0].road_address ? res[0].road_address.address_name : res[0].address.address_name;
        showInfo(m, a);
      }
    });
    const pos = new K.LatLng(m.lat, m.lon);
    rvClient.getNearestPanoId(pos, 50, panoId => {
      const msg = document.getElementById('rvmsg');
      if (panoId === null) { rvEl.style.display = 'none'; if (msg) msg.textContent = '이 근처(50m)에는 로드뷰 사진이 없어요.'; return; }
      rvEl.style.display = 'block';
      if (!roadview) roadview = new K.Roadview(rvEl);
      roadview.setPanoId(panoId, pos);
      if (msg) msg.textContent = '아래는 이 지점 근처의 로드뷰 사진이에요 (촬영 시점은 운행 시점과 다릅니다).';
    });
  }

  // Dots: white every minute; stops and events on top (optional layers start hidden).
  const overlays = [...route.points, ...route.dwells, ...route.events].map(m => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (m.kind === 'point' ? ' min' : isRing(m) ? ' ring' + (m.kind === 'dwell' ? ' stop' : '') : '');
    if (isRing(m)) dot.style.borderColor = colorOf(m);
    else if (m.kind !== 'point') dot.style.background = colorOf(m);
    dot.title = when(m.t);
    dot.addEventListener('click', e => { e.stopPropagation(); select(m); });
    const ov = new K.CustomOverlay({ position: new K.LatLng(m.lat, m.lon), content: dot, xAnchor: 0.5, yAnchor: 0.5, clickable: true, zIndex: m.kind === 'event' ? 3 : m.kind === 'dwell' ? 2 : 1 });
    return { m, ov };
  });
  const apply = () => overlays.forEach(({ m, ov }) => ov.setMap(visible(m) ? map : null));
  onLayersChanged = apply; apply();

  // Tapping the road line anywhere picks the nearest recorded place.
  K.event.addListener(map, 'click', e => {
    const proj = map.getProjection(), tap = proj.containerPointFromCoords(e.latLng);
    const best = pickMark(tap, route, m => proj.containerPointFromCoords(new K.LatLng(m.lat, m.lon)), 40, 24);
    if (best) select(best);
  });
}

/**
 * No map key / offline: the same marks on a plain drawing, tappable, without address or road view.
 * Drawn in screen pixels (so dots keep their size) and redrawn on every move: drag to pan,
 * pinch or wheel to zoom.
 */
function drawFallback(route, message) {
  const el = document.getElementById('map');
  el.id = 'mapfb';
  document.getElementById('viewhint').insertAdjacentHTML('beforebegin',
    '<p class="rvmsg">' + message + ' 점 사이는 직선이라 실제 도로와 다를 수 있어요.</p>');
  const g = measure(route);
  const P = 24;
  const items = [...route.points, ...route.dwells, ...route.events];
  let W = el.clientWidth || 360, H = el.clientHeight || 420;
  let v = firstView(route, g, W, H, P, false);
  const canClose = v.partial;
  const maxMpp = firstView(route, g, W, H, P, true).mpp * 2, minMpp = 0.3;
  let selected = null;
  const X = m => W / 2 + (m.x - v.cx) / v.mpp, Y = m => H / 2 - (m.y - v.cy) / v.mpp;

  function render() {
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    if (route.line.length > 1) svg += '<polyline fill="none" stroke="#4a4640" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" points="' +
      route.line.map(p => X(p).toFixed(1) + ',' + Y(p).toFixed(1)).join(' ') + '"/>';
    let lastDot = null; // zoomed far out, minute dots closer than 20 px would merge into a dotted line: skip those
    items.forEach(m => {
      if (!visible(m)) return;
      const x = X(m), y = Y(m);
      if (x < -40 || x > W + 40 || y < -40 || y > H + 40) return;
      if (m.kind === 'point') {
        if (lastDot && Math.hypot(x - lastDot.x, y - lastDot.y) < 20 && m !== route.points[route.points.length - 1]) return;
        lastDot = { x, y };
      }
      const r = m.kind === 'point' ? 4 : m.kind === 'dwell' ? 15 : 9;
      if (isRing(m)) {
        svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="none" stroke="#fff" stroke-width="7"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="none" stroke="' + colorOf(m) + '" stroke-width="4"/>';
      } else {
        const stroke = m.kind === 'point' ? 'none' : '#fff';
        svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + colorOf(m) + '" stroke="' + stroke + '" stroke-width="3"/>';
      }
    });
    if (selected) { // downward triangle above the chosen place, tip on the centre of the road
      const x = X(selected), y = Y(selected);
      svg += '<polygon points="' + x + ',' + y + ' ' + (x - 11) + ',' + (y - 21) + ' ' + (x + 11) + ',' + (y - 21) + '" fill="#191919" stroke="#fff" stroke-width="2"/>';
    }
    el.innerHTML = svg + '</svg>';
  }
  function show(whole) {
    v = firstView(route, g, W, H, P, whole);
    if (canClose) setViewUi(v.partial, () => show(v.partial));
    render();
  }
  function zoomAt(px, py, f) {
    const mpp = Math.min(maxMpp, Math.max(minMpp, v.mpp * f));
    // keep the ground under (px, py) where it is
    const gx = v.cx + (px - W / 2) * v.mpp, gy = v.cy - (py - H / 2) * v.mpp;
    v = { ...v, mpp, cx: gx - (px - W / 2) * mpp, cy: gy + (py - H / 2) * mpp };
  }
  function tap(px, py) {
    // Close to a mark: that mark; on the road line: the nearest visible mark (~24 px / ~16 px).
    const best = pickMark({ x: px, y: py }, route, m => ({ x: X(m), y: Y(m) }), 24, 16);
    if (best) { selected = best; showInfo(best); render(); }
  }

  const ptrs = new Map();
  let moved = 0, last = null;
  const local = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const pair = () => { const [a, b] = [...ptrs.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size === 1) moved = 0;
    last = ptrs.size === 2 ? pair() : local(e);
  });
  el.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, local(e));
    if (ptrs.size === 1) {
      const p = local(e), dx = p.x - last.x, dy = p.y - last.y;
      moved += Math.abs(dx) + Math.abs(dy);
      v = { ...v, cx: v.cx - dx * v.mpp, cy: v.cy + dy * v.mpp };
      last = p;
    } else if (ptrs.size === 2) {
      const q = pair();
      v = { ...v, cx: v.cx - (q.x - last.x) * v.mpp, cy: v.cy + (q.y - last.y) * v.mpp };
      if (q.d > 0 && last.d > 0) zoomAt(q.x, q.y, last.d / q.d);
      moved += 100; // a pinch is never a tap
      last = q;
    }
    render();
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && moved < 8) tap(p.x, p.y);
    if (ptrs.size === 1) last = [...ptrs.values()][0];
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); });
  el.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(p.x, p.y, Math.exp(e.deltaY * 0.0015)); render(); }, { passive: false });
  window.addEventListener('resize', () => { W = el.clientWidth || W; H = el.clientHeight || H; render(); });

  onLayersChanged = render;
  show(false);
}
</script>
</body>
</html>
